/* ── картинки ── */
function imgFor(src){

  o.img.onload = function(){ o.ok = true; draw(); }; o.img.onerror = function(){ o.err = true; draw(); };
  if (src.indexOf('fig:') === 0) o.img.src = 'assets/fig/' + src.slice(4);
  else if (src.indexOf('st:') === 0) { o.img.crossOrigin = 'anonymous'; toSign[src.slice(3)] = o; clearTimeout(signT); signT = setTimeout(sign, 30); }
  return o;
}
async function sign(){
  var paths = Object.keys(toSign); if (!paths.length) return; var map = toSign; toSign = {};
  var r = await sb.storage.from('edu-board').createSignedUrls(paths, 6 * 3600);
  (r.data || []).forEach(function(x){ var o = map[x.path]; if (!o) return; if (x.signedUrl) o.img.src = x.signedUrl; else { o.err = true; draw(); } });
}
function shrink(file){ return new Promise(function(ok){ var im = new Image(), u = URL.createObjectURL(file);

    c.width = Math.round(w * k); c.height = Math.round(h * k); var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(function(b){ ok({blob: b || file, w: c.width, h: c.height}); }, 'image/jpeg', .86); };
  im.onerror = function(){ URL.revokeObjectURL(u); ok(null); }; im.src = u; }); }

/* ── операции, отмена, сохранение ── */
function find(id){ for (var i = 0; i < els.length; i++) if (els[i].id === id) return els[i]; return null; }
function apply(op, remote){
  if (op.k === 'add') op.els.forEach(function(e){ if (!find(e.id)) els.push(e); if (remote) delete drafts[e.by || '']; });
  else if (op.k === 'del') { els = els.filter(function(e){ return op.ids.indexOf(e.id) < 0; }); if (op.ids.indexOf(sel) >= 0) sel = null; }
  else if (op.k === 'upd') op.els.forEach(function(e){ for (var i = 0; i < els.length; i++) if (els[i].id === e.id) els[i] = e; });
  else if (op.k === 'clear') { els = []; sel = null; }
  else if (op.k === 'set') { els = op.els; }
  else if (op.k === 'bg') bg = op.bg;
  draw(); scheduleSave(remote ? 2500 : 800);
}
function commit(op, inv){ apply(op, false); send('op', op); undoS.push({op: op, inv: inv}); if (undoS.length > 200) undoS.shift(); redoS = []; btns(); }
function undo(){ var u = undoS.pop(); if (!u) return; apply(u.inv, false); send('op', u.inv); redoS.push(u); btns(); }
function redo(){ var u = redoS.pop(); if (!u) return; apply(u.op, false); send('op', u.op); undoS.push(u); btns(); }
function btns(){ $('bdUndo').disabled = !undoS.length; $('bdRedo').disabled = !redoS.length; }

async function save(){
  if (!board) return; if (saving) { scheduleSave(600); return; } saving = true; var snap = {els: els, bg: bg};
  var r = await sb.rpc('edu_board_save', {p_board: board.id, p_data: snap}); saving = false;
  if (r.error || r.data === false) { status('err'); console.error(r.error); clearTimeout(saveT); saveT = setTimeout(save, 5000); return; }
  dirty = false; status();
}
function status(s){ var e = $('bdSave'); e.textContent = s === 'err' ? 'Не сохранилось — пробую ещё раз' : dirty ? 'Сохраняю…' : 'Сохранено'; e.style.color = s === 'err' ? 'var(--peach-d)' : ''; }
window.addEventListener('beforeunload', function(ev){ if (dirty) { save(); ev.preventDefault(); ev.returnValue = ''; } });

/* ── живая связь ── */
function send(ev, payload){ if (ch && live) ch.send({type: 'broadcast', event: ev, payload: payload}); }

  var my = ch = sb.channel('board:' + board.id, {config: {private: true, broadcast: {self: false}, presence: {key: me.uid}}});
  my.on('broadcast', {event: 'op'}, function(m){ if (my === ch) apply(m.payload, true); })
    .on('broadcast', {event: 'draft'}, function(m){ drafts[m.payload.by] = m.payload.el; draw(); })
    .on('broadcast', {event: 'cur'}, function(m){ var p = m.payload; cursors[p.by] = {x: p.x, y: p.y, n: p.n, r: p.r, t: Date.now()}; placeCursors(); })
    .on('broadcast', {event: 'laser'}, function(m){ m.payload.pts.forEach(function(p){ lasers.push({x: p[0], y: p[1], t: Date.now(), by: m.payload.by}); }); draw(); })
    .on('broadcast', {event: 'view'}, function(m){ if (!isT) { view = m.payload; draw(); toast('Учитель показал свою часть доски'); } })
    .on('broadcast', {event: 'hello'}, function(){ var s = JSON.stringify({els: els, bg: bg}); if (els.length && s.length < 200000) send('state', {els: els, bg: bg}); })

  g.setTransform(s, 0, 0, s, -(b[0] - pad) * s, -(b[1] - pad) * s); drawBg(g, b[0] - pad, b[1] - pad, w, h, s); els.forEach(function(e){ drawEl(g, e); });
  try { c.toBlob(function(bl){ var a = document.createElement('a'); a.href = URL.createObjectURL(bl); var d = new Date(); a.download = 'doska-' + ('0' + d.getDate()).slice(-2) + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + d.getFullYear() + '.png';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }, 'image/png'); }
  catch (e) { toast('Не получилось сохранить картинку'); }
}

/* ── доски: список, создание, открытие ── */
function closePops(){ $('bdMenu').hidden = true; $('bdFigs').hidden = true; }
$('bdPick').addEventListener('click', function(ev){ ev.stopPropagation(); var m = $('bdMenu'); if (!m.hidden) { m.hidden = true; return; } closePops(); renderMenu(); m.hidden = false; });
$('bdFigBtn').addEventListener('click', function(ev){ ev.stopPropagation(); var f = $('bdFigs'); if (!f.hidden) { f.hidden = true; return; } closePops(); renderFigs(); f.hidden = false; });
document.addEventListener('click', function(ev){ if (!ev.target.closest('.bd-pop') && !ev.target.closest('#bdPick') && !ev.target.closest('#bdFigBtn')) closePops(); });
function renderFigs(){
  var f = $('bdFigs'); if (f.dataset.done) return; f.dataset.done = 1;
  f.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font:900 18px var(--f-head)">Чертежи из уроков</b><button type="button" class="bd-t ghost" data-x>Закрыть</button></div>' +
    FIGS.map(function(g){ return '<div class="g">' + esc(g.g) + '</div><div class="grid">' + g.items.map(function(it){
      return '<button type="button" data-fig="' + esc(it.f) + '"><img loading="lazy" src="assets/fig/' + esc(it.f) + '" alt="">' + esc(it.c || '') + '</button>'; }).join('') + '</div>'; }).join('');
  f.addEventListener('click', function(ev){ if (ev.target.closest('[data-x]')) { closePops(); return; } var b = ev.target.closest('[data-fig]'); if (!b) return;
    var im = b.querySelector('img'); closePops(); placeImg('fig:' + b.dataset.fig, im.naturalWidth || 600, im.naturalHeight || 400); });
}
function renderMenu(){
  var m = $('bdMenu'), h = '';
  if (isT) {
    h += '<h3>Ученик</h3><select id="bmStudent">' + students.map(function(s){ return '<option value="' + s.id + '"' + (board && s.id === board.student_id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select>';
    h += '<h3>Доски ученика</h3><div class="bd-list">' + (boards.length ? boards.map(function(b){ return '<button type="button" data-open="' + b.id + '" class="' + (board && b.id === board.id ? 'on' : '') + '"><span>' + esc(b.title) + '</span><small>' + (b.lesson_id ? 'занятие ' : '') + fmtD(b.created_at) + '</small></button>'; }).join('') : '<p class="muted" style="margin:4px 10px">Досок пока нет.</p>') + '</div>';
    h += '<h3>Новая доска</h3><label for="bmTitle">Название</label><input id="bmTitle" value="Занятие ' + fmtD(new Date()) + '">' +
      '<label for="bmLesson">Привязать к занятию</label><select id="bmLesson"><option value="">не привязывать</option>' + lessons.map(function(l){ return '<option value="' + l.id + '">' + fmtDate(l.date) + (l.topic_text || l.topic ? ' · ' + esc(l.topic_text || l.topic) : '') + '</option>'; }).join('') + '</select>' +
      '<div class="bd-row"><button type="button" class="bd-t dark" id="bmNew">Создать доску</button></div>';
    h += '<div class="bd-row"><a class="bd-t ghost" href="journal.html">Открыть журнал →</a></div>';
    if (board) h += '<h3>Эта доска</h3><label for="bmRen">Название</label><input id="bmRen" value="' + esc(board.title) + '"><div class="bd-row"><button type="button" class="bd-t" id="bmSave">Сохранить название</button><button type="button" class="bd-t ghost" id="bmDel">Удалить доску</button></div>';
  } else {
    h += '<h3>Мои доски</h3><div class="bd-list">' + boards.map(function(b){ return '<button type="button" data-open="' + b.id + '" class="' + (board && b.id === board.id ? 'on' : '') + '"><span>' + esc(b.title) + '</span><small>' + (b.lesson_date ? 'занятие ' + fmtDate(b.lesson_date) : fmtD(b.created_at)) + '</small></button>'; }).join('') + '</div>' +
      '<div class="bd-row"><button type="button" class="bd-t" id="bmDraft">+ Свой черновик</button></div>';
  }
  m.innerHTML = h;
  m.querySelectorAll('[data-open]').forEach(function(b){ b.addEventListener('click', function(){ closePops(); openBoard(b.dataset.open); }); });
  if (isT) {
    $('bmStudent').addEventListener('change', async function(){ closePops(); await forStudent(this.value, true); });
    $('bmNew').addEventListener('click', async function(){ var id = await createBoard(board ? board.student_id : $('bmStudent').value, $('bmTitle').value.trim(), $('bmLesson').value || null); closePops(); if (id) openBoard(id); });
    if (board) { $('bmSave').addEventListener('click', async function(){ var t = $('bmRen').value.trim() || 'Доска'; var r = await sb.from('edu_boards').update({title: t}).eq('id', board.id); if (r.error) { toast('Не сохранилось'); return; }
        board.title = t; $('bdTitle').textContent = t; var bb = boards.find(function(x){ return x.id === board.id; }); if (bb) bb.title = t; closePops(); toast('Название сохранено'); });
      $('bmDel').addEventListener('click', async function(){ if (!confirmBox('Удалить доску «' + board.title + '»? Это нельзя отменить.')) return;
        var imgsList = els.filter(function(e){ return e.t === 'img' && e.src.indexOf('st:') === 0; }).map(function(e){ return e.src.slice(3); });
        var r = await sb.from('edu_boards').delete().eq('id', board.id); if (r.error) { toast('Не удалилось'); return; }
        if (imgsList.length) await sb.storage.from('edu-board').remove(imgsList); var sid = board.student_id; board = null; dirty = false; closePops(); toast('Доска удалена'); forStudent(sid, false); }); }
  } else $('bmDraft').addEventListener('click', async function(){ var r = await sb.rpc('edu_board_new', {p_title: 'Черновик ' + fmtD(new Date())}); if (r.error) { toast('Не получилось создать'); return; } closePops(); await loadMine(); openBoard(r.data); });
}
async function createBoard(sid, title, lesson){
  var r = await sb.from('edu_boards').insert({student_id: sid, title: title || 'Занятие ' + fmtD(new Date()), lesson_id: lesson || null}).select().single();
  if (r.error) { toast('Не получилось создать доску'); return null; } boards.unshift(r.data); return r.data.id;
}
async function forStudent(sid, auto){
  var r = await sb.from('edu_boards').select('id,title,lesson_id,created_at,student_id').eq('student_id', sid).order('created_at', {ascending: false});
  boards = r.data || []; var l = await sb.from('edu_lessons').select('id,date,topic,topic_text').eq('student_id', sid).order('date', {ascending: false}).limit(30);
  lessons = l.data || []; lessons.forEach(function(x){ x.topic_text = x.topic_text || TOPIC_NAME(x.topic); });
  if (boards.length) return openBoard(boards[0].id);
  var today = lessons.find(function(x){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return x.date === d.toISOString().slice(0, 10); });
  var id = await createBoard(sid, 'Занятие ' + fmtD(new Date()), today ? today.id : null); if (id) openBoard(id);
}
function TOPIC_NAME(k){ return k ? ({g1: 'Урок 1', g2: 'Урок 2', g3: 'Урок 3', g4: 'Урок 4', g5: 'Урок 5'}[k] || k) : ''; }
async function loadMine(){ var r = await sb.rpc('edu_my_boards'); boards = r.data || []; return boards; }
async function openBoard(id){
  if (board && dirty) await save();
  var r = await sb.rpc('edu_board_get', {p_board: id}); var b = r.data && r.data[0];
  if (!b) { showEmpty('<h2>Нет доступа к этой доске</h2><p class="muted">Доска открывается только учителю и ученику, для которого она создана.</p>'); return; }
  board = {id: b.id, student_id: b.student_id, title: b.title}; els = (b.data && b.data.els) || []; bg = (b.data && b.data.bg) || 'grid'; lastUpd = b.updated_at;
  undoS = []; redoS = []; sel = null; drafts = {}; cursors = {}; $('bdCursors').innerHTML = ''; btns(); dirty = false; status();
  document.body.classList.add('board-open'); $('bdTitle').textContent = b.title; $('bdEmpty').hidden = true; $('bdBar').hidden = false; stage.hidden = false; $('bdShow').hidden = !isT;
  var u = new URL(location.href); u.searchParams.set('b', b.id); u.searchParams.delete('s'); history.replaceState(null, '', u);
  layout(); if (els.length) fit(); else { view = {x: -40, y: -40, z: 1}; draw(); }
  connect();
}
function showEmpty(h){ document.body.classList.remove('board-open'); $('bdEmpty').innerHTML = h; $('bdEmpty').hidden = false; $('bdBar').hidden = true; stage.hidden = true; }
async function checkNew(){
  if (isT || !board) return; var list = await loadMine(); var nb = list[0];
  if (nb && nb.id !== board.id && new Date(nb.created_at) > new Date(Date.now() - 6 * 3600e3) && !checkNew.seen[nb.id]) {
    var bn = $('bdBanner'); bn.innerHTML = 'Учитель открыл новую доску «' + esc(nb.title) + '»<button type="button">Перейти</button><button type="button" style="background:transparent;color:#fff">✕</button>'; bn.hidden = false;
    bn.querySelectorAll('button')[0].onclick = function(){ bn.hidden = true; openBoard(nb.id); }; bn.querySelectorAll('button')[1].onclick = function(){ bn.hidden = true; checkNew.seen[nb.id] = 1; }; }
}
checkNew.seen = {};
window.__board = {els: function(){ return els; }, board: function(){ return board; }, view: function(){ return view; }, exp: function(){ return exportPng(); }};   // для автотестов

K.state.then(async function(st){
  if (!st || !st.session || !K.sb) return; sb = K.sb; document.body.classList.add('board-page');
  me.uid = st.session.user.id; isT = st.role === 'teacher' && !st.asStudent; me.role = isT ? 'teacher' : 'student'; me.name = isT ? 'Учитель' : 'Ученик';
  setTool('pen'); document.querySelector('[data-color]').classList.add('on'); document.querySelector('[data-w="2"]').classList.add('on');
  var q = new URLSearchParams(location.search), b = q.get('b'), s = q.get('s');
  if (isT) {
    var r = await sb.from('edu_students').select('id,name').order('created_at'); students = r.data || [];
    if (b) { await openBoard(b); if (board) forStudentList(board.student_id); }
    else if (s) await forStudent(s, true);
    else if (!students.length) showEmpty('<h2>Сначала добавьте ученика</h2><p class="muted">Доска создаётся для ученика из журнала.</p><p><a class="btn" href="journal.html">Открыть журнал →</a></p>');
    else showEmpty('<h2>Доска с учеником</h2><p class="muted">Выберите, с кем занимаетесь, — откроется его последняя доска или новая на сегодня.</p><div class="bd-list" style="max-width:360px;margin:16px auto;text-align:left">' +
      students.map(function(x){ return '<button type="button" data-s="' + x.id + '"><span>' + esc(x.name) + '</span><small>открыть →</small></button>'; }).join('') + '</div>'), document.querySelectorAll('[data-s]').forEach(function(x){ x.onclick = function(){ forStudent(x.dataset.s, true); }; });
  } else {
    var list = await loadMine();
    if (b) await openBoard(b); else if (list.length) await openBoard(list[0].id);
    else { var info = await sb.rpc('edu_my_info');
      showEmpty(info.data && info.data.length ? '<h2>Доски пока нет</h2><p class="muted">Учитель откроет доску на занятии — она появится здесь. А пока можно завести свой черновик.</p><p><button type="button" class="btn" id="bdFirst">Свой черновик</button></p>'
        : '<h2>Доска появится после привязки</h2><p class="muted">Учитель ещё не привязал твой аккаунт к журналу. Напиши ему — и здесь появится общая доска для занятий.</p>');
      var fb = $('bdFirst'); if (fb) fb.onclick = async function(){ var r2 = await sb.rpc('edu_board_new', {p_title: 'Черновик ' + fmtD(new Date())}); if (!r2.error) { await loadMine(); openBoard(r2.data); } }; }
    var ms = +(load('bdPollMs') || 20000); newT = setInterval(checkNew, ms);
  }
});
async function forStudentList(sid){ var r = await sb.from('edu_boards').select('id,title,lesson_id,created_at,student_id').eq('student_id', sid).order('created_at', {ascending: false}); boards = r.data || [];
  var l = await sb.from('edu_lessons').select('id,date,topic,topic_text').eq('student_id', sid).order('date', {ascending: false}).limit(30); lessons = l.data || []; }
})();
</script>
