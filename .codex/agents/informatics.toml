developer_instructions = """
Работай в структуре «Кабинета математики». Перед разработкой прочитай типичные уроки el5.html, el12.html, a12.html и g11.html, а также их презентации и рабочие листы. Для учительских материалов проверь scripts/build_lesson_pack.py и действующие маршруты t.html. Урок g5 по построению сечений — особый случай. Парные задания, большие банки, чертежи и дополнительные форматы используй, когда это нужно самой теме или попросил пользователь.

Сначала сверяй уровень ученика, номер и содержание задания с программой и актуальной демоверсией ФИПИ. Пиши собственные условия. Планируй обычное занятие на 90 минут. Дай содержательную теорию с объяснением причин, правилами, таблицами и несколькими разобранными примерами. Для алгоритмов начинай с ручного выполнения по шагам; если уместен Python, используй ту же задачу, объясни выбор границы перебора и проверь программу. Покажи частые ошибки и способы проверки. Основной порядок страницы: теория и примеры, пронумерованные задачи урока, тест, домашнее задание. Для коротких заданий ориентир — 6–8 основных задач и примерно 6 домашних. Сложность темы и учебная цель определяют объём. Необязательные условия держи в резерве за пределами основного маршрута.

Используй assets/style.css и существующую HTML-разметку Кабинета: .hero, .btn.lime, .def, .thm, .warn, .ex с .ex-sol, .task, .cards, .goal. Слайды используй в формате sel5.html с assets/slides.css, Playfair Display и Inter. Рабочий лист открывается на сайте и использует .sheet, .sec и .lines. Сохраняй привычные ссылки на презентацию, лист, тест и домашнее задание. Готовь слайды для доски по образцу существующих наборов и сохраняй изображения, на которые могут ссылаться прежние доски.

На закрытой версии страницы учителя размести план на 90 минут и полные решения практики, ДЗ и тестов рядом с нужными разделами, используя существующий проверенный маршрут. Для уроков информатики шаблон — t.html#inf4 и t.html#inf5. PDF готовь по запросу. Защитные материалы должны быть зашифрованы или ограничены серверной ролью учителя. Ученику доступны условия и разобранные учебные примеры. Держи ответы к самостоятельным задачам и ключи к тестам в закрытом хранилище; не помещай их в общедоступный HTML, скрипты или изображения. Следуй правилу показа ответов: самопроверка после попытки, контрольная по разрешению учителя.

Проверь решения независимо, включая граничные случаи и ответы в требуемом формате. Сверь номера и условия урока, рабочего листа, слайдов и учительских решений. Проверь обе роли, режим «Глазами ученика», слайды на доске, выдачу ДЗ через журнал и первую попытку теста из «Домашки». Сохраняй уже назначенные задания и данные учащихся. Проверь опубликованную версию после разрешённого развёртывания.
